databases:
  - name: academia-db
    plan: free

services:
  - type: web
    name: academia-sia101
    runtime: docker
    plan: free
    healthCheckPath: /dashboard/home
    envVars:
      - key: APP_NAME
        value: Academia Portal
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: academia-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
