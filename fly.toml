app = "academia-sia101-fly"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "data"
  destination = "/var/www/html/database"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
